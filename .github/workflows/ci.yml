name: CI for Climate Insights
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Check code style
      run: flake8 src
    - name: Generate climate report plot
      run: python src/analyze.py data/demodata.csv output/plot.png
    - name: Upload plot artifact
      uses: actions/upload-artifact@v4
      with:
        name: climate-plot
        path: output/plot.png
